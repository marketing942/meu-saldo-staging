<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prévia — App de organização financeira</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#F3F4F6;--card:#FFFFFF;--ink:#1B2230;--mut:#6B7280;--line:#E6E8EC;--nec:#3C8D6A;--des:#C65468;--warn:#C98F2E;--acc:#2E4A7A;--tab:#FFFFFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1A1E24;--ink:#ECEEF1;--mut:#98A0AB;--line:#2A2F37;--tab:#16191E;--acc:#8FA9D6;--nec:#6DB896;--des:#E08A9A;--warn:#DDB25A}}
:root[data-theme="dark"]{--bg:#111418;--card:#1A1E24;--ink:#ECEEF1;--mut:#98A0AB;--line:#2A2F37;--tab:#16191E;--acc:#8FA9D6;--nec:#6DB896;--des:#E08A9A;--warn:#DDB25A}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:90px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
header button{width:44px;height:44px;border:0;border-radius:50%;background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
#mes{font-weight:600;font-size:18px;text-align:center}
#mes small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
main{padding:0 16px;display:grid;gap:14px}
.card{background:var(--card);border-radius:20px;padding:16px}
h2{font-size:13px;font-weight:600;color:var(--mut);margin-bottom:8px}
.big{font-size:34px;font-weight:600;letter-spacing:-1px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:13px}
.nec{color:var(--nec)}.des{color:var(--des)}
.eye{background:none;border:0;font-size:18px;cursor:pointer;color:var(--mut)}
.alert{border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--warn) 18%,var(--card));border-left:5px solid var(--warn);font-size:14px}
.alert b{display:block}
.split{height:16px;border-radius:8px;display:flex;overflow:hidden;position:relative;margin:10px 0 6px}
.split i{display:block;height:100%}
.meta{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--bg);flex:none}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.pill.n{background:color-mix(in srgb,var(--nec) 18%,transparent);color:var(--nec)}
.pill.d{background:color-mix(in srgb,var(--des) 18%,transparent);color:var(--des)}
.day{font-size:13px;font-weight:600;color:var(--mut);margin:6px 2px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:22px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer;min-height:44px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cc{border-radius:20px;padding:16px;color:#fff;min-width:240px;flex:none}
.cards{display:flex;gap:12px;overflow-x:auto}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--tab);display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;padding:10px 0;min-height:56px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--acc);font-weight:700}
.fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50% - 199px));z-index:7;height:52px;padding:0 20px;border:0;border-radius:26px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(10,14,30,.55);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet>div{background:var(--card);width:100%;max-width:430px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet input,.sheet select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;min-height:44px}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog button{min-height:54px;border-radius:14px;border:2px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.tog button.sn{border-color:var(--nec);background:color-mix(in srgb,var(--nec) 16%,transparent)}
.tog button.sd{border-color:var(--des);background:color-mix(in srgb,var(--des) 16%,transparent)}
.save{min-height:50px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:20;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%}
.toast.show{opacity:1}
svg text{fill:var(--mut);font-family:inherit;font-size:10px}
.sc{overflow-x:auto}

body{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.4}
.card{border-radius:16px;border:1px solid var(--line)}
.big{font-weight:600;letter-spacing:-.5px;font-size:32px}
#mes{font-weight:600;font-size:17px}
header button{border:1px solid var(--line);font-size:18px}
h2{font-weight:500}
.alert{border-left:0;border-radius:14px}
.ic{border-radius:50%;font-weight:600;font-size:14px;color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.pill,.chip{border-radius:999px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--card)}
.save,.fab{background:var(--acc);color:var(--card);border-radius:14px}
.fab{border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.14);font-weight:500}
.split{height:12px}
.cc{border-radius:16px}
.sheet>div{border-radius:20px 20px 0 0}
.eye{font-size:13px;min-height:44px;padding:0 6px}
nav button span{display:flex;justify-content:center;margin-bottom:3px}
nav button{font-weight:500}
